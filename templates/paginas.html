<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Páginas - Impresora 24 Horas</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container" style="max-width: 520px;">
        <h2>Configurar Impresión</h2>
        <p>Archivo: <strong>{{ filename }}</strong></p>
        <p style="margin-bottom: 20px;">Total de páginas detectadas: <strong>{{ total_paginas }}</strong></p>
        
        <!-- Mensajes Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('procesar_paginas') }}">
            <input type="hidden" name="filename" value="{{ filename }}">
            <input type="hidden" name="total_paginas" value="{{ total_paginas }}">

            <label for="tipo_impresion">Tipo de impresión</label>
            <select id="tipo_impresion" name="tipo_impresion" required>
                <option value="bn">Blanco y Negro ($100 por página)</option>
                <option value="color">Color ($200 por página)</option>
            </select>

            <label for="modo_seleccion">¿Qué páginas deseas imprimir?</label>
            <select id="modo_seleccion" name="modo_seleccion" onchange="togglePersonalizado()" required>
                <option value="todas">Todas las páginas</option>
                <option value="personalizado">Rango personalizado (ej. 1-5, 8, 10-12)</option>
            </select>

            <div id="campo_personalizado" style="display: none;">
                <label for="paginas_input">Ingresa las páginas o rangos</label>
                <input type="text" id="paginas_input" name="paginas_input" placeholder="Ej: 1-3, 5, 8-10">
            </div>

            <button type="submit" style="margin-top: 10px;">Calcular y Ver Resumen</button>
        </form>

        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('index') }}" style="color: var(--text-muted); font-size: 0.85rem;">← Subir otro archivo</a>
        </div>
    </div>

    <script>
        function togglePersonalizado() {
            var modo = document.getElementById('modo_seleccion').value;
            var campo = document.getElementById('campo_personalizado');
            if (modo === 'personalizado') {
                campo.style.display = 'block';
            } else {
                campo.style.display = 'none';
            }
        }
    </script>
</body>
</html>
